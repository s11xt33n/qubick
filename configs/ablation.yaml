# Эксперимент 3. Абляция компонентов квантового слоя:
# способ кодирования, тип анзаца, повторная загрузка данных.
name: ablation
seeds: [0, 1, 2, 3, 4]
grid:
  dataset: [moons, circles, breast_cancer]
  model: [quantum, hybrid]
  encoding: [angle, angle_x, dense]
  ansatz: [strong, basic, hea]
